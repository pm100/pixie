[package]
name = "pixie-app"
version.workspace = true
edition.workspace = true

[lib]
name = "pixie_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["heic"]
heic = ["pixie-image/heic"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = "1"
open = "5"
pixie-analysis = { path = "../crates/pixie-analysis" }
pixie-core = { path = "../crates/pixie-core" }
pixie-geo = { path = "../crates/pixie-geo" }
pixie-image = { path = "../crates/pixie-image" }
pixie-index = { path = "../crates/pixie-index" }
pixie-mail = { path = "../crates/pixie-mail" }

[dev-dependencies]
tempfile = { workspace = true }
