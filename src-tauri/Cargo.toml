[package]
name = "pixie-app"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true

[lib]
name = "pixie_app_lib"
# Desktop only: the staticlib/cdylib the Tauri mobile template adds were never used, and linking the cdylib is what
# kept failing on Windows ("unresolved external symbol anon..." in pixie_app_lib).
crate-type = ["rlib"]

[features]
default = ["heic"]
heic = ["pixie-image/heic"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = "1"
open = "5"
base64 = "0.22"
# Ask Pixie: the one call that sends a typed question to the proxy.
ureq = "2"
trash = "5"
# Tells us when a file appears, changes or goes in a folder on this computer (not used for network folders).
notify = "6"
pixie-analysis = { path = "../crates/pixie-analysis" }
pixie-core = { path = "../crates/pixie-core" }
pixie-geo = { path = "../crates/pixie-geo" }
pixie-image = { path = "../crates/pixie-image" }
pixie-index = { path = "../crates/pixie-index" }
pixie-mail = { path = "../crates/pixie-mail" }

[dev-dependencies]
tempfile = { workspace = true }
image = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Copying photos to the clipboard on a Mac: the system pasteboard (these crates are already in the build through Tauri), and PNG for the picture.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSArray", "NSData"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard"] }
image = { workspace = true }

# Emailing a photo from Outlook: classic Outlook through COM (a PowerShell script), new Outlook through the Windows Share sheet. Copying to the clipboard.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["ApplicationModel_DataTransfer", "Storage", "Foundation", "Foundation_Collections", "Win32_Foundation", "Win32_System_WinRT", "Win32_UI_Shell", "Storage_Streams", "Win32_System_DataExchange", "Win32_System_Memory"] }
windows-collections = "0.2"
