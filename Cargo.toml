[workspace]
resolver = "2"
members = ["crates/*", "src-tauri"]

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["JollyGoodSW LLC", "Paul Moore"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff"] }
kamadak-exif = "0.6"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
tempfile = "3"

# `tauri dev` builds with the dev profile; unoptimised image decoding is 10-30x
# slower, so optimise dependencies (and lightly our own code) even in dev.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The face grouping is heavy arithmetic over thousands of vectors.
[profile.dev.package.pixie-index]
opt-level = 3
