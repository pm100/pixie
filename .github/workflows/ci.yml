name: ci
on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      VCPKGRS_TRIPLET: x64-windows
      VCPKGRS_DYNAMIC: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: libheif (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The runner's vcpkg lives at VCPKG_INSTALLATION_ROOT; libheif-sys looks at VCPKG_ROOT.
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          vcpkg install "libheif[core]:x64-windows"
          # libheif and libde265 are DLLs; the tests need to find them.
          "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - run: npm install
      - run: npm --prefix ui install
      - run: npm --prefix ui test
      - run: npm --prefix ui run check
      - run: npm --prefix ui run build
      - run: cargo test --workspace
      - run: cargo build -p pixie-app
